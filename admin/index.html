<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex, nofollow"/>
  <meta name="theme-color" content="#07070f"/>
  <title>Admin Login — STY. J Nexus</title>
  <link rel="icon" href="../assets/images/logo.svg" type="image/svg+xml"/>
  <link rel="stylesheet" href="../assets/css/admin.css"/>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="admin-body">

  <div class="admin-login">
    <div class="admin-login__card">
      <div class="admin-login__icon">⚡</div>
      <h1 class="admin-login__title">STY.J Admin</h1>
      <p class="admin-login__sub">Sign in to manage your orders & store</p>

      <form class="admin-form" id="login-form" novalidate>
        <input type="password" placeholder="Enter admin password" autocomplete="current-password" required/>
        <div class="error-msg" id="login-error">❌ Incorrect password. Try again.</div>
        <button type="submit" class="btn-login">Sign In →</button>
      </form>

      <p style="margin-top:1.5rem;font-size:0.75rem;color:#636366;text-align:center;">
        Default password: <code style="color:#0a84ff;background:rgba(10,132,255,0.1);padding:2px 6px;border-radius:4px;">styj2024</code><br/>
        <span style="color:#ff9f0a;">⚠️ Change this in admin.js after setup</span>
      </p>
    </div>
  </div>

  <script>
    const firebaseConfig = { apiKey:"YOUR_API_KEY", authDomain:"YOUR_PROJECT.firebaseapp.com", projectId:"YOUR_PROJECT_ID", storageBucket:"YOUR_PROJECT.appspot.com", messagingSenderId:"YOUR_SENDER_ID", appId:"YOUR_APP_ID" };
    if (typeof firebase !== 'undefined') firebase.initializeApp(firebaseConfig);
  </script>
  <script src="../assets/js/products.js"></script>
  <script src="../assets/js/admin.js"></script>
</body>
</html>
