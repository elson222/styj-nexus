<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="icon" href="assets/images/logo.svg" type="image/svg+xml"/>

<body style="background:#ffffff;">
  <main style="min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:2rem;text-align:center;">

      <div style="width:72px;height:72px;border-radius:50%;background:#eafaf1;border:2px solid #34c759;display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#34c759" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>

      <h1 style="font-size:clamp(1.75rem,6vw,2.4rem);font-weight:800;letter-spacing:-0.03em;margin-bottom:0.5rem;color:var(--clr-text);">

      </p>
      <p style="font-size:0.9rem;color:var(--clr-text-2);margin-bottom:2rem;line-height:1.6;">
        Your order is recorded in our system. WhatsApp will open automatically to complete delivery coordination with STY. J Tech Hub.
      </p>

      <div style="display:flex;flex-direction:column;gap:0.75rem;">
        <a id="success-wa-btn" href="https://wa.me/233553714373" target="_blank" rel="noopener" class="btn btn-wa btn-lg" style="width:100%;justify-content:center;">
          Confirm via WhatsApp
        </a>
        <a href="index.html" class="btn btn-secondary btn-lg" style="width:100%;justify-content:center;">
          &larr; Return to Store
        </a>
      </div>

      <p style="margin-top:2rem;font-size:0.8rem;color:var(--clr-text-3);">
        Questions? Call store directly: <a href="tel:0553714373" style="color:var(--clr-blue);font-weight:700;">055 371 4373</a>
      </p>
    </div>
  </main>

  <script src="assets/js/products.js"></script>
  <script src="assets/js/app.js"></script>
