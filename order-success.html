      </p>

      <div style="display:flex;flex-direction:column;gap:0.75rem;animation:fadeSlideUp 0.9s ease 0.4s both;">
        <a id="success-wa-btn" href="https://wa.me/233553714373" target="_blank" rel="noopener" class="btn btn-wa btn-lg" style="width:100%;justify-content:center;">

        <a href="index.html" class="btn btn-glass btn-lg" style="width:100%;justify-content:center;">
          &larr; Return to Store
        </a>

        Direct Support Line: <a href="tel:0553714373" style="color:var(--clr-blue);">055 371 4373</a>
