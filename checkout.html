<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#ffffff"/>
  <title>Checkout — STY. J Nexus</title>
  <link rel="icon" href="assets/images/logo.svg" type="image/svg+xml"/>
  <link rel="stylesheet" href="assets/css/main.css"/>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <!-- ── Navigation ── -->
  <nav class="navbar" role="navigation" aria-label="Main Navigation">
    <div class="navbar__inner">
      <a href="index.html" class="navbar__logo">
        <span class="navbar__logo-text">STY.J <span>NEXUS</span></span>
      </a>
      <div class="navbar__actions">
        <a href="cart.html" class="cart-btn" aria-label="Shopping bag">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
          </svg>
          <span class="cart-badge"></span>
        </a>
      </div>
    </div>
  </nav>

  <!-- ── Checkout Main ── -->
  <main style="padding-top:calc(56px + 2rem);padding-bottom:5rem;min-height:100dvh;background:#ffffff;">
    <div class="container" style="max-width:580px;">
      <h1 style="font-size:clamp(1.6rem,5vw,2.2rem);font-weight:800;letter-spacing:-0.03em;margin-bottom:0.4rem;">
        Checkout
      </h1>
      <p style="color:var(--clr-text-2);font-size:0.9rem;margin-bottom:1.5rem;">
        Enter your delivery address and contact details. We confirm stock and coordinate dispatch directly with you.
      </p>

      <!-- Order Summary Card -->
      <div style="background:var(--clr-bg-alt);border:1px solid var(--clr-border);border-radius:var(--r-lg);padding:1.25rem;margin-bottom:1.5rem;">
        <h2 style="font-size:0.8rem;font-weight:700;color:var(--clr-text-2);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:0.75rem;">
          Your Order Summary
        </h2>
        <div id="checkout-summary"></div>
      </div>

      <!-- Checkout Form -->
      <form id="order-form" novalidate>
        <input type="hidden" name="_subject" value="New Order — STY. J Nexus"/>
        <input type="hidden" name="order_items" id="order-items"/>
        <input type="hidden" name="order_total" id="order-total"/>
        <input type="hidden" name="source" value="styj-nexus-website"/>

        <div style="background:#ffffff;border:1px solid var(--clr-border);border-radius:var(--r-xl);padding:1.5rem;box-shadow:var(--shadow-card);display:flex;flex-direction:column;gap:1.25rem;">
          <h2 style="font-size:1rem;font-weight:800;color:var(--clr-text);">Delivery Information</h2>

          <div class="form-group">
            <label class="form-label" for="name">Your Name *</label>
            <input class="form-input" type="text" id="name" name="name" placeholder="e.g. Kwame Mensah" required autocomplete="name"/>
          </div>

          <div class="form-group">
            <label class="form-label" for="phone">Phone / WhatsApp Number *</label>
            <input class="form-input" type="tel" id="phone" name="phone" placeholder="055 371 4373" required autocomplete="tel" inputmode="tel"/>
          </div>

          <div class="form-group">
            <label class="form-label" for="location">Delivery City &amp; Area *</label>
            <input class="form-input" type="text" id="location" name="location" placeholder="e.g. East Legon, Accra / KNUST, Kumasi" required autocomplete="address-level2"/>
          </div>

          <div class="form-group">
            <label class="form-label" for="delivery_type">Fulfillment Method</label>
            <select class="form-input" id="delivery_type" name="delivery_type">
              <option value="delivery">Doorstep Delivery (Nationwide)</option>
              <option value="pickup">In-Person Pickup (Accra)</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="notes">Special Requests / Preferred Colors</label>
            <textarea class="form-input" id="notes" name="notes" placeholder="e.g. Desert Titanium, deliver in afternoon" rows="2"></textarea>
          </div>

          <button type="submit" class="btn btn-primary btn-lg" style="width:100%;margin-top:0.5rem;justify-content:center;">
            Complete Order &rarr;
          </button>

          <p style="font-size:0.75rem;color:var(--clr-text-3);text-align:center;line-height:1.4;">
            Your order is registered in our database and opens WhatsApp for instant confirmation.
          </p>
        </div>
      </form>
    </div>
  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCLUI_WsWZKCAEims4ffoMGFEdJFEIL5Ac",
      authDomain: "styj-nexus.firebaseapp.com",
      projectId: "styj-nexus",
      storageBucket: "styj-nexus.firebasestorage.app",
      messagingSenderId: "1008828465224",
      appId: "1:1008828465224:web:f87f7b03e642cda4ba987d",
      measurementId: "G-WJS97K0NL4"
    };
    if (typeof firebase !== 'undefined') firebase.initializeApp(firebaseConfig);
  </script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
