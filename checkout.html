<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#020618"/>
  <title>Direct Checkout — STY. J Nexus Ghana</title>
  <meta name="description" content="Complete your order for verified Apple devices and laptops with doorstep delivery or Accra pickup."/>
  <link rel="canonical" href="https://styj.nexus/checkout.html"/>
  <meta http-equiv="X-Content-Type-Options" content="nosniff"/>
  <meta name="referrer" content="strict-origin-when-cross-origin"/>
  <link rel="icon" href="assets/images/logo.svg" type="image/svg+xml"/>
  <link rel="stylesheet" href="assets/css/main.css"/>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <!-- ── Navigation ── -->
  <nav class="navbar" role="navigation" aria-label="Main Navigation">
    <div class="navbar__inner">
      <a href="index.html" class="navbar__logo">
        <span class="navbar__logo-text">STY.J <span>NEXUS</span></span>
      </a>
      <div class="navbar__actions">
        <button class="nav-search-btn" id="nav-search-btn" aria-label="Search devices" title="Search (/)" onclick="openSearchModal()">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
        <a href="cart.html" class="cart-btn" aria-label="Shopping bag">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
          </svg>
          <span class="cart-badge"></span>
        </a>
      </div>
    </div>
  </nav>

  <!-- ── Checkout Main ── -->
  <main style="padding-top:calc(56px + 2rem);padding-bottom:5rem;min-height:100dvh;background:var(--color-background);">
    <div class="container" style="max-width:680px;">
      <!-- Breadcrumb / Back -->
      <a href="cart.html" style="display:inline-flex;align-items:center;gap:6px;font-size:0.85rem;color:var(--clr-text-2);margin-bottom:1.5rem;font-weight:600;">
        &larr; Back to Bag
      </a>

      <h1 style="font-size:clamp(1.5rem, 4vw, 2rem);font-weight:800;letter-spacing:-0.03em;color:var(--clr-text);margin-bottom:0.4rem;">
        Checkout
      </h1>
      <p style="color:var(--clr-text-2);font-size:0.875rem;margin-bottom:1.5rem;">
        Nationwide Delivery. Complete your order details below.
      </p>

      <!-- Order Summary Card -->
      <div style="background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--r-lg);padding:1.25rem;margin-bottom:1.25rem;">
        <h2 style="font-size:0.8rem;font-weight:700;color:var(--clr-text-2);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:0.75rem;">
          Your Order Summary
        </h2>
        <div id="checkout-summary"></div>
      </div>

      <!-- Nationwide Delivery & Guarantee Banner -->
      <div style="background:rgba(56,189,248,0.06);border:1px solid rgba(56,189,248,0.2);border-radius:var(--r-lg);padding:0.75rem 1rem;margin-bottom:1.25rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">
        <div style="font-size:0.825rem;color:#ffffff;font-weight:700;display:flex;align-items:center;gap:6px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <span>Nationwide Delivery &bull; 48-Hour Guarantee</span>
        </div>
        <a href="javascript:void(0)" onclick="openPolicyModal('returns')" style="color:#38bdf8;font-size:0.78rem;font-weight:700;text-decoration:none;">Store Policies &rarr;</a>
      </div>

      <!-- Checkout Form -->
      <form id="order-form" novalidate>
        <input type="hidden" name="_subject" value="New Order — STY. J Nexus"/>
        <input type="hidden" name="order_items" id="order-items"/>
        <input type="hidden" name="order_total" id="order-total"/>
        <input type="hidden" name="source" value="styj-nexus-website"/>

        <div style="background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--r-xl);padding:1.5rem;box-shadow:var(--shadow-card);display:flex;flex-direction:column;gap:1.25rem;">
          <h2 style="font-size:1rem;font-weight:800;color:var(--clr-text);">Delivery Information</h2>

          <div class="form-group">
            <label class="form-label" for="name">Your Name *</label>
            <input class="form-input" type="text" id="name" name="name" placeholder="e.g. Kwame Mensah" required autocomplete="name"/>
          </div>

          <div class="form-group">
            <label class="form-label" for="phone">Phone / WhatsApp Number *</label>
            <input class="form-input" type="tel" id="phone" name="phone" placeholder="055 371 4373" required autocomplete="tel" inputmode="tel"/>
          </div>

          <div class="form-group">
            <label class="form-label" for="location">Delivery City &amp; Area *</label>
            <input class="form-input" type="text" id="location" name="location" placeholder="e.g. East Legon, Accra / KNUST, Kumasi" required autocomplete="address-level2"/>
          </div>

          <div class="form-group">
            <label class="form-label" for="delivery_type">Delivery Option</label>
            <select class="form-input" id="delivery_type" name="delivery_type">
              <option value="delivery">Nationwide Delivery</option>
              <option value="pickup">In-Person Pickup (Accra)</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="notes">Special Requests / Preferred Colors</label>
            <textarea class="form-input" id="notes" name="notes" placeholder="e.g. Desert Titanium, deliver in afternoon" rows="2"></textarea>
          </div>

          <!-- ── Payment Methods Selector ── -->
          <div class="form-group" style="margin-top:0.25rem;">
            <label class="form-label" style="font-weight:800;font-size:0.925rem;margin-bottom:0.75rem;display:flex;align-items:center;justify-content:space-between;">
              <span>Payment Method *</span>
              <span style="font-size:0.725rem;color:var(--clr-blue);font-weight:600;">Nationwide Delivery</span>
            </label>

            <div class="payment-methods-grid" style="display:flex;flex-direction:column;gap:0.75rem;">
              <!-- Option 1: Pay on Delivery -->
              <label class="payment-method-card active" id="card-pay-delivery" style="display:flex;gap:12px;padding:0.9rem 1.1rem;border:1px solid #38bdf8;border-radius:14px;background:rgba(56,189,248,0.06);cursor:pointer;transition:all var(--t-fast);">
                <input type="radio" name="payment_method" value="pay_on_delivery" checked style="margin-top:3px;accent-color:#38bdf8;" />
                <div style="flex:1;">
                  <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
                    <strong style="color:#ffffff;font-size:0.925rem;">1. Pay on Delivery</strong>
                    <span style="font-size:0.68rem;font-weight:800;padding:2px 8px;border-radius:9999px;background:rgba(56,189,248,0.18);color:#38bdf8;">NATIONWIDE</span>
                  </div>
                  <p style="font-size:0.8rem;color:#94a3b8;margin-top:0.25rem;line-height:1.4;">
                    Inspect device upon delivery before paying via MoMo or cash.
                  </p>
                </div>
              </label>

              <!-- Option 2: Direct MTN MoMo Pay -->
              <label class="payment-method-card" id="card-momo-pay" style="display:flex;gap:12px;padding:0.9rem 1.1rem;border:1px solid rgba(255,255,255,0.12);border-radius:14px;background:rgba(255,255,255,0.02);cursor:pointer;transition:all var(--t-fast);">
                <input type="radio" name="payment_method" value="momo_pay" style="margin-top:3px;accent-color:#38bdf8;" />
                <div style="flex:1;">
                  <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
                    <strong style="color:#ffffff;font-size:0.925rem;">2. Direct MTN MoMo Pay</strong>
                    <span style="font-size:0.68rem;font-weight:700;padding:2px 8px;border-radius:9999px;background:rgba(250,204,21,0.15);color:#facc15;">055 371 4373</span>
                  </div>
                  <p style="font-size:0.8rem;color:#94a3b8;margin-top:0.25rem;line-height:1.4;">
                    Direct transfer to the official STY. J Nexus MoMo Merchant account.
                  </p>
                </div>
              </label>
            </div>
          </div>

          <button type="submit" id="checkout-submit-btn" class="btn btn-primary btn-lg" style="width:100%;margin-top:0.5rem;justify-content:center;font-size:1rem;">
            Place Order &amp; Connect on WhatsApp &rarr;
          </button>

          <p style="font-size:0.75rem;color:var(--clr-text-3);text-align:center;line-height:1.4;">
            Direct Verification with STY. J Nexus &bull; No online card payment required &bull; Nationwide Delivery
          </p>
        </div>
      </form>
    </div>
  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCLUI_WsWZKCAEims4ffoMGFEdJFEIL5Ac",
      authDomain: "styj-nexus.firebaseapp.com",
      projectId: "styj-nexus",
      storageBucket: "styj-nexus.firebasestorage.app",
      messagingSenderId: "1008828465224",
      appId: "1:1008828465224:web:f87f7b03e642cda4ba987d",
      measurementId: "G-WJS97K0NL4"
    };
    if (typeof firebase !== 'undefined') firebase.initializeApp(firebaseConfig);
  </script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
